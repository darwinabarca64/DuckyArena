<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bodyGrad_body_yellow" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="60%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>
    <radialGradient id="headGrad_body_yellow" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="65%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>
    <linearGradient id="beakGrad_body_yellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- CAPA 0: CUERPO BASE (Z-INDEX 10) -->
  <g id="ducky-body-base" filter="url(#dropShadow)">
    
    <!-- PATAS / PIES (Anclaje y=450) -->
    <!-- Pata Izquierda -->
    <g id="left-foot">
      <path d="M 180 435 C 160 450, 150 465, 170 472 C 185 478, 195 470, 205 460 C 215 472, 230 472, 235 460 C 240 450, 230 435, 215 432 Z" 
            fill="#F97316" stroke="#C2410C" stroke-width="4" stroke-linejoin="round" />
      <path d="M 175 460 Q 190 450 200 440" stroke="#C2410C" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 215 462 Q 220 450 220 438" stroke="#C2410C" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Pata Derecha -->
    <g id="right-foot">
      <path d="M 332 435 C 352 450, 362 465, 342 472 C 327 478, 317 470, 307 460 C 297 472, 282 472, 277 460 C 272 450, 282 435, 297 432 Z" 
            fill="#F97316" stroke="#C2410C" stroke-width="4" stroke-linejoin="round" />
      <path d="M 337 460 Q 322 450 312 440" stroke="#C2410C" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 297 462 Q 292 450 292 438" stroke="#C2410C" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>

    <!-- COLA DEL PATO (Izquierda trasera) -->
    <path d="M 170 340 C 120 325, 100 300, 115 285 C 135 270, 160 305, 185 315 Z" 
          fill="#D97706" stroke="#B45309" stroke-width="4" />
    <path d="M 180 325 C 140 310, 125 290, 135 280 C 150 270, 175 295, 195 308 Z" 
          fill="#FBBF24" />

    <!-- TORSO / PECHO (Centro anclaje y=320) -->
    <ellipse cx="256" cy="325" rx="108" ry="92" 
             fill="url(#bodyGrad_body_yellow)" stroke="#B45309" stroke-width="5" />
    
    <!-- SOMBRA ABDOMINAL / VOLUMEN -->
    <path d="M 175 350 C 200 405, 312 405, 337 350 C 315 385, 197 385, 175 350 Z" 
          fill="#D97706" opacity="0.35" />

    <!-- ALA IZQUIERDA -->
    <path d="M 155 280 C 130 300, 130 355, 155 375 C 170 388, 190 370, 185 340 C 180 305, 170 285, 155 280 Z" 
          fill="url(#bodyGrad_body_yellow)" stroke="#B45309" stroke-width="4" />
    <path d="M 148 315 C 145 340, 160 360, 172 365" 
          stroke="#D97706" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- ALA DERECHA -->
    <path d="M 357 280 C 382 300, 382 355, 357 375 C 342 388, 322 370, 327 340 C 332 305, 342 285, 357 280 Z" 
          fill="url(#bodyGrad_body_yellow)" stroke="#B45309" stroke-width="4" />
    <path d="M 364 315 C 367 340, 352 360, 340 365" 
          stroke="#D97706" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- CUELLO INTEGRADO -->
    <path d="M 215 220 C 215 255, 297 255, 297 220 Z" 
          fill="#FBBF24" />

    <!-- MECHÓN DE PLUMAS EN LA CABEZA (y=75) -->
    <path d="M 256 88 C 248 65, 235 55, 245 45 C 255 52, 258 70, 260 85 Z" 
          fill="#FBBF24" stroke="#B45309" stroke-width="3"/>
    <path d="M 260 88 C 265 62, 278 52, 270 42 C 260 50, 255 68, 254 85 Z" 
          fill="#FDE68A" stroke="#B45309" stroke-width="3"/>

    <!-- CABEZA (Centro anclaje y=160, radio=80) -->
    <circle cx="256" cy="160" r="82" 
            fill="url(#headGrad_body_yellow)" stroke="#B45309" stroke-width="5" />
    
    <!-- MEJILLAS BRILLO / HIGHLIGHT -->
    <ellipse cx="205" cy="180" rx="14" ry="9" fill="#FDE68A" opacity="0.4"/>
    <ellipse cx="307" cy="180" rx="14" ry="9" fill="#FDE68A" opacity="0.4"/>

    <!-- PICO BASE (Anclaje y=185 - y=205) -->
    <g id="beak-base">
      <ellipse cx="256" cy="198" rx="44" ry="22" 
               fill="url(#beakGrad_body_yellow)" stroke="#EA580C" stroke-width="4" />
      <path d="M 220 196 Q 256 208 292 196" 
            stroke="#EA580C" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- Fosas nasales -->
      <ellipse cx="247" cy="188" rx="2.5" ry="3.5" fill="#EA580C"/>
      <ellipse cx="265" cy="188" rx="2.5" ry="3.5" fill="#EA580C"/>
    </g>

  </g>
</svg>