{% extends 'base.html' %}

{% block title %}Registro - QuizzMaster{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <div class="login-icon">🎯</div>
            <h1>Crear cuenta</h1>
            <p>Las cuentas nuevas se registran como alumnos.</p>
        </div>

        <form class="login-form" method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Nombre de usuario</label>
                <input type="text" id="username" name="username" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="password_confirmation">Confirmar contraseña</label>
                <input type="password" id="password_confirmation" name="password_confirmation" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary btn-large">Crear cuenta</button>
        </form>

        <div class="login-footer">
            <p>¿Ya tienes una cuenta? <a href="{% url 'quizz_app:login' %}" class="link-inline">Inicia sesión</a></p>
        </div>
    </div>
</div>
{% endblock %}
