{% extends 'base.html' %}

{% block title %}Login - QuizzMaster{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <div class="login-icon">🎯</div>
            <h1>QuizzMaster</h1>
            <p>Sistema de Quizzes Interactivo</p>
        </div>

        <form id="loginForm" class="login-form" method="POST">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            <div class="form-group">
                <label for="username">Usuario o correo electrónico</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    class="form-control" 
                    placeholder="Ingresa tu usuario o correo"
                    autocomplete="off"
                    required
                >
                <div class="input-hint">Puedes usar tu usuario o correo electrónico</div>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-control" 
                    placeholder="Ingresa tu contraseña"
                    autocomplete="off"
                    required
                >
                <div class="input-hint">Ej: 123456</div>
            </div>

            <button type="submit" class="btn btn-primary btn-large btn-pulse">
                🔐 Iniciar Sesión
            </button>
        </form>

        <div class="login-footer">
            <p>¿No tienes una cuenta? <a href="{% url 'quizz_app:register' %}" class="link-inline">Regístrate</a></p>
        </div>
    </div>
</div>

<style>
    .login-container {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: calc(100vh - 100px);
        padding: 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .login-card {
        background: white;
        border-radius: 20px;
        padding: 50px;
        width: 100%;
        max-width: 450px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        animation: slideInUp 0.6s ease-out;
    }

    .login-header {
        text-align: center;
        margin-bottom: 40px;
    }

    .login-icon {
        font-size: 3.5rem;
        display: block;
        margin-bottom: 15px;
        animation: bounce 1s infinite;
    }

    .login-header h1 {
        font-size: 2rem;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 5px;
        font-weight: 800;
    }

    .login-header p {
        color: #666;
        font-size: 0.95rem;
    }

    .login-form {
        margin-bottom: 30px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #333;
        font-size: 0.95rem;
    }

    .form-control {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 1rem;
        transition: all 0.3s ease;
        font-family: inherit;
    }

    .form-control:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        transform: translateY(-2px);
    }

    .input-hint {
        font-size: 0.8rem;
        color: #999;
        margin-top: 5px;
    }

    .alert {
        padding: 12px 15px;
        border-radius: 10px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
        animation: slideInDown 0.5s ease-out;
    }

    .alert-error {
        background: #ffebee;
        border: 2px solid #f44336;
        color: #c62828;
    }

    .alert-icon {
        font-size: 1.3rem;
    }

    .alert-text {
        flex: 1;
        font-weight: 600;
    }

    .login-demo {
        background: #f8f9fa;
        border-radius: 15px;
        padding: 20px;
        margin-bottom: 20px;
        border: 2px dashed #e0e0e0;
    }

    .login-demo h3 {
        margin: 0 0 15px 0;
        color: #333;
        font-size: 1rem;
        text-align: center;
    }

    .demo-users {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .demo-user {
        background: white;
        padding: 12px;
        border-radius: 8px;
        border-left: 4px solid #667eea;
    }

    .demo-user.profesor {
        border-left-color: #667eea;
    }

    .demo-user.estudiante {
        border-left-color: #4caf50;
    }

    .demo-user h4 {
        margin: 0 0 8px 0;
        font-size: 0.9rem;
        color: #333;
    }

    .demo-user p {
        margin: 4px 0;
        font-size: 0.8rem;
        color: #666;
    }

    .demo-user p strong {
        color: #333;
    }

    .login-footer {
        text-align: center;
        padding-top: 20px;
        border-top: 1px solid #e0e0e0;
        color: #666;
        font-size: 0.9rem;
    }

    .link-inline {
        color: #667eea;
        text-decoration: none;
        font-weight: 600;
        transition: all 0.3s ease;
    }

    .link-inline:hover {
        color: #764ba2;
        text-decoration: underline;
    }

    @media (max-width: 600px) {
        .login-card {
            padding: 30px 20px;
        }

        .demo-users {
            grid-template-columns: 1fr;
        }

        .login-icon {
            font-size: 2.5rem;
        }

        .login-header h1 {
            font-size: 1.5rem;
        }
    }
</style>

<script>
    // Validación de cliente (opcional, para mejor UX)
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        // Validar campos vacíos
        if (!username || !password) {
            e.preventDefault();
            showNotification('Por favor completa todos los campos');
            return false;
        }
        
        // Mostrar loading
        const button = this.querySelector('button[type="submit"]');
        button.innerHTML = '⏳ Verificando...';
        button.disabled = true;
        
        // Permitir envío al servidor
        return true;
    });
    
</script>

<style>
    @keyframes fadeOut {
        from {
            opacity: 1;
            transform: translateY(0);
        }
        to {
            opacity: 0;
            transform: translateY(-10px);
        }
    }
</style>
{% endblock %}
